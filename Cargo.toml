[package]
name = "freshdeps"
version = "0.1.0"
edition = "2024"
description = "Check whether a project's dependencies are the latest versions across Python, JavaScript, Rust, Go and Android projects"
license = "MIT"

[[bin]]
name = "freshdeps"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
toml = { version = "0.8", features = ["parse"] }
ureq = { version = "3", features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
